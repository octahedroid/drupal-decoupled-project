# Default Drupal 10 Tugboat starter config.
# https://docs.tugboatqa.com/starter-configs/tutorials/drupal-10/
services:
  storage:
    image: tugboatqa/debian:forky
    commands:
      init:
        - |
          set -e
          wget https://dl.min.io/server/minio/release/linux-amd64/minio
          chmod +x minio
          mkdir /data
          mkdir -p /etc/service/minio
          echo "#!/bin/sh" > /etc/service/minio/run
          echo "/minio server /data" >> /etc/service/minio/run
          chmod +x /etc/service/minio/run

  # Define the database service.
  database:
    image: tugboatqa/mariadb:12

    # A set of commands to run while building this service
    commands:
      # Configure the server for the site to run on.
      init:
        # Increase the allowed packet size to 512MB.
        - mariadb -e "SET GLOBAL max_allowed_packet=536870912;"
        # Ensure this packet size persists even if MariaDB restarts.
        - echo "max_allowed_packet=536870912" >> /etc/mysql/conf.d/tugboat.cnf

      # Commands that import files, databases,  or other assets. When an
      # existing preview is refreshed, the build workflow starts here,
      # skipping the init step, because the results of that step will
      # already be present.
      update: []

      # Run any commands needed to prepare the site.  This is generally not needed
      # for database services.
      build: []

  # Define the webserver service.
  webserver:
    image: tugboatqa/php:8.3-apache
    expose: 80
    checkout: true
    depends:
      - database
      - storage

    # A set of commands to run while building this service
    commands:
      # The INIT command configures the webserver.
      init:
        # Increase PHP memory limit.
        - echo "memory_limit = -1" > /usr/local/etc/php/conf.d/tugboat-memory.ini
        # Install opcache and mod-rewrite.
        - apt update && apt install -y libzip-dev
        - docker-php-ext-install opcache zip
        - a2enmod headers rewrite
        # Install MinIO client.
        - curl https://dl.min.io/client/mc/release/linux-amd64/mc --create-dirs -o $HOME/minio-binaries/mc
        - chmod +x $HOME/minio-binaries/mc
        # Set up MinIO client.
        - |
          set -e
          $HOME/minio-binaries/mc alias set storage http://storage:9000 minioadmin minioadmin
          $HOME/minio-binaries/mc mb storage/urls
        # Link the document root to the expected path. This example links /web
        # to the docroot.
        - ln -snf "${TUGBOAT_ROOT}/web" "${DOCROOT}"

      # Commands that import files, databases,  or other assets. When an
      # existing preview is refreshed, the build workflow starts here,
      # skipping the init step, because the results of that step will
      # already be present.
      update:
        ## Install Drupal
        - |
          set -e
          composer require drush/drush
          composer install
          vendor/bin/drush site:install minimal --db-url=mysql://tugboat:tugboat@database/tugboat --account-name=drupaldecoupled --account-pass=drupaldecoupled -y
        # Apply local settings patch
        - git apply "${TUGBOAT_ROOT}/.tugboat/patches/enable-local-settings.patch" || true
        # Set the tugboat-specific Drupal settings.
        - cp "${TUGBOAT_ROOT}/.tugboat/settings.local.php" "${DOCROOT}/sites/default/settings.local.php"
        # Copy the consumer generation script to the docroot.
        - cp "${TUGBOAT_ROOT}/.tugboat/replace_preview_consumer.php" "${DOCROOT}/../replace_preview_consumer.php"

        ## Update Composer minimum-stability
        - composer config minimum-stability --merge --json "dev"

        ## Extend Drupal using Recipes
        - |
          set -e
          composer require octahedroid/drupal-decoupled-graphql-advanced-recipe:^2
          vendor/bin/drush recipe ../recipes/drupal-decoupled-graphql-advanced-recipe -v

        ## Generate scopes
        - vendor/bin/drush php:script scripts/scopes
        ## Generate consumers
        - vendor/bin/drush php:script scripts/consumers
        ## Generate menus
        - vendor/bin/drush php:script scripts/menus

        ## Rebuild permissions
        - vendor/bin/drush php-eval 'node_access_rebuild();'
        - vendor/bin/drush cr

        # Make sure our files and translations folders exists and are writable.
        - |
          set -e
          mkdir -p "${DOCROOT}/sites/default/files/translations"
          chgrp -R www-data "${DOCROOT}/sites/default/files"
          find "${DOCROOT}/sites/default/files" -type d -exec chmod 2775 {} \;
          find "${DOCROOT}/sites/default/files" -type f -exec chmod 0664 {} \;
          chgrp -R www-data "${DOCROOT}/../keys"
          find "${DOCROOT}/../keys" -type f -exec chmod 0660 {} \;

      # Commands that build the site. This is where you would add things
      # like feature reverts or any other drush commands required to
      # set up or configure the site. When a preview is built from a
      # base preview, the build workflow starts here, skipping the init
      # and update steps, because the results of those are inherited
      # from the base preview.
      build:
        # Install new configuration and database updates.
        - vendor/bin/drush cache:rebuild
        - vendor/bin/drush config:export --yes && vendor/bin/drush config:import --yes
        - vendor/bin/drush updatedb --yes

        # Write webserver public URL stored on minio(storage).
        - echo "${TUGBOAT_SERVICE_URL%/}" > webserver-url && $HOME/minio-binaries/mc put webserver-url storage/urls
        - vendor/bin/drush php:script replace_preview_consumer

        # One last cache rebuild.
        - vendor/bin/drush cache:rebuild
        # Generate a one-time login link.
        - vendor/bin/drush uli -l $TUGBOAT_SERVICE_URL
        - echo "backend-url:${TUGBOAT_SERVICE_URL}"
      clone:
        # Write updated webserver public URL stored on minio(storage).
        - echo "${TUGBOAT_SERVICE_URL%/}" > webserver-url && $HOME/minio-binaries/mc put webserver-url storage/urls
        - vendor/bin/drush php:script replace_preview_consumer
        # Generate a one-time login link.
        - vendor/bin/drush uli -l $TUGBOAT_SERVICE_URL
        - echo "backend-url:${TUGBOAT_SERVICE_URL}"

  frontend:
    image: tugboatqa/debian:forky
    depends:
      - webserver
      - storage
    expose: 8080
    default: true
    commands:
      init:
        - mkdir -p /etc/service/frontend
        - apt update && apt install -y git curl
        # Install MinIO client.
        - |
          set -e
          curl https://dl.min.io/client/mc/release/linux-amd64/mc --create-dirs -o $HOME/minio-binaries/mc
          chmod +x $HOME/minio-binaries/mc
        # Set up MinIO client.
        - $HOME/minio-binaries/mc alias set storage http://storage:9000 minioadmin minioadmin
        # Install Node.js and Yarn.
        - |
          set -e
          curl -fsSL https://deb.nodesource.com/setup_20.x -o nodesource_setup.sh && bash nodesource_setup.sh
          apt install -y nodejs
          npm install -g pnpm
      update: []
      build:
        # Set the frontend framework, replace this line with the framework you are using.
        - echo "next" > /etc/service/frontend/framework
        # Scaffold the frontend into the service container.
        - pnpm dlx create-react-router@latest /var/lib/tugboat-fe --template octahedroid/drupal-decoupled/starters/$(cat /etc/service/frontend/framework) --no-git-init --no-color --no-motion -y
        # Build the frontend with required env vars.
        - |
          set -e
          export DRUPAL_CLIENT_ID=${TUGBOAT_DEFAULT_SERVICE_ID}
          export DRUPAL_CLIENT_SECRET=${TUGBOAT_PREVIEW_ID}${TUGBOAT_DEFAULT_SERVICE_TOKEN}
          export DRUPAL_AUTH_URI=$($HOME/minio-binaries/mc cat storage/urls/webserver-url)
          export DRUPAL_GRAPHQL_URI=$($HOME/minio-binaries/mc cat storage/urls/webserver-url)/graphql
          export ENVIRONMENT=preview
          pnpm --dir /var/lib/tugboat-fe build
        # Create the service runit script.
        - |
          set -e
          echo "#!/bin/sh" > /etc/service/frontend/run
          echo "export DRUPAL_CLIENT_ID=${TUGBOAT_DEFAULT_SERVICE_ID}" >> /etc/service/frontend/run
          echo "export DRUPAL_CLIENT_SECRET=${TUGBOAT_PREVIEW_ID}${TUGBOAT_DEFAULT_SERVICE_TOKEN}" >> /etc/service/frontend/run
          echo "export DRUPAL_AUTH_URI=$($HOME/minio-binaries/mc cat storage/urls/webserver-url)" >> /etc/service/frontend/run
          echo "export DRUPAL_GRAPHQL_URI=$($HOME/minio-binaries/mc cat storage/urls/webserver-url)/graphql" >> /etc/service/frontend/run
          echo "export ENVIRONMENT=preview" >> /etc/service/frontend/run
          echo "export NODE_VERSION=v20.10.0" >> /etc/service/frontend/run
          echo "export PORT=8080" >> /etc/service/frontend/run
          echo "export HOST=0.0.0.0" >> /etc/service/frontend/run
          echo "pnpm --dir /var/lib/tugboat-fe start" >> /etc/service/frontend/run
          chmod +x /etc/service/frontend/run
        - echo "frontend-url:${TUGBOAT_SERVICE_URL}"
      clone:
        # Set the frontend framework, replace this line with the framework you are using.
        - echo "next" > /etc/service/frontend/framework
        # Recreate the service runit script.
        - |
          set -e
          echo "#!/bin/sh" > /etc/service/frontend/run
          echo "export DRUPAL_CLIENT_ID=${TUGBOAT_DEFAULT_SERVICE_ID}" >> /etc/service/frontend/run
          echo "export DRUPAL_CLIENT_SECRET=${TUGBOAT_PREVIEW_ID}${TUGBOAT_DEFAULT_SERVICE_TOKEN}" >> /etc/service/frontend/run
          echo "export DRUPAL_AUTH_URI=$($HOME/minio-binaries/mc cat storage/urls/webserver-url)" >> /etc/service/frontend/run
          echo "export DRUPAL_GRAPHQL_URI=$($HOME/minio-binaries/mc cat storage/urls/webserver-url)/graphql" >> /etc/service/frontend/run
          echo "export ENVIRONMENT=preview" >> /etc/service/frontend/run
          echo "export NODE_VERSION=v20.10.0" >> /etc/service/frontend/run
          echo "export PORT=8080" >> /etc/service/frontend/run
          echo "export HOST=0.0.0.0" >> /etc/service/frontend/run
          echo "pnpm --dir /var/lib/tugboat-fe start" >> /etc/service/frontend/run
          chmod +x /etc/service/frontend/run
        - echo "frontend-url:${TUGBOAT_SERVICE_URL}"

  storybook:
    image: tugboatqa/debian:forky
    expose: 6006
    commands:
      init:
        - mkdir -p /etc/service/storybook
        - apt update && apt install -y git curl
        # Install Node.js and Yarn.
        - |
          set -e
          curl -fsSL https://deb.nodesource.com/setup_20.x -o nodesource_setup.sh && bash nodesource_setup.sh
          apt install -y nodejs
          npm install -g pnpm http-server
      update: []
      build:
        # Set the frontend framework, replace this line with the framework you are using.
        - echo "next" > /etc/service/storybook/framework
        # Scaffold the frontend into the service container.
        - pnpm dlx create-react-router@latest /var/lib/tugboat-storybook --template octahedroid/drupal-decoupled/starters/$(cat /etc/service/storybook/framework) --no-git-init --no-color --no-motion -y
        # Build storybook.
        - pnpm --dir /var/lib/tugboat-storybook build-storybook
        # Create the service runit script.
        - |
          set -e
          echo "#!/bin/sh" > /etc/service/storybook/run
          echo "cd /var/lib/tugboat-storybook && http-server ./storybook-static -p 6006" >> /etc/service/storybook/run
          chmod +x /etc/service/storybook/run
        - echo "storybook-url:${TUGBOAT_SERVICE_URL}"
      clone:
        # Create the service runit script.
        - |
          set -e
          echo "#!/bin/sh" > /etc/service/storybook/run
          echo "cd /var/lib/tugboat-storybook && http-server ./storybook-static -p 6006" >> /etc/service/storybook/run
          chmod +x /etc/service/storybook/run
        - echo "storybook-url:${TUGBOAT_SERVICE_URL}"
